version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=mock
      - DATABASE_URL=sqlite+aiosqlite:///intentguard.db
      - APP_ENV=development
    volumes:
      - ./backend:/app/backend
      - ./intentguard.db:/app/intentguard.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
