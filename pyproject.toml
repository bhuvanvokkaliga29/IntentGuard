[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intentguard"
version = "1.0.0"
description = "Semantic Authorization & Control Layer for Autonomous Financial AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "IntentGuard Engineering Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "google-generativeai>=0.4.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.1",
    "alembic>=1.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "razorpay>=2.0.1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
