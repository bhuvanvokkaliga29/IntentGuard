apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intentguard-ingress
  namespace: intentguard
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: intentguard.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: intentguard-backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: intentguard-frontend-service
                port:
                  number: 3000
