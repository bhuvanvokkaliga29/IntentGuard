apiVersion: apps/v1
kind: Deployment
metadata:
  name: intentguard-backend
  namespace: intentguard
  labels:
    app: intentguard-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: intentguard-backend
  template:
    metadata:
      labels:
        app: intentguard-backend
    spec:
      containers:
        - name: backend
          image: intentguard/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: intentguard-config
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: intentguard-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: XAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: intentguard-secrets
                  key: XAI_API_KEY
                  optional: true
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
            requests:
              cpu: "250m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: intentguard-backend-service
  namespace: intentguard
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: intentguard-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: intentguard-backend-hpa
  namespace: intentguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: intentguard-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
