apiVersion: apps/v1
kind: Deployment
metadata:
  name: intentguard-worker
  namespace: intentguard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intentguard-worker
  template:
    metadata:
      labels:
        app: intentguard-worker
    spec:
      containers:
        - name: worker
          image: intentguard/backend:latest
          command: ["python", "backend/worker.py"]
          envFrom:
            - configMapRef:
                name: intentguard-config
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: intentguard-secrets
                  key: GEMINI_API_KEY
                  optional: true
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
